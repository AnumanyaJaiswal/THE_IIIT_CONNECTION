<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Skill Profile</title>

  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">

  <style>
    :root {
      --primary: #6366f1;
      --primary-dark: #4f46e5;
      --bg: #0f172a;
      --card: #1e293b;
      --text: #e2e8f0;
      --muted: #94a3b8;
      --border: #334155;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Inter', sans-serif;
    }

    body {
      background: var(--bg);
      padding: 30px 15px;
      color: var(--text);
    }

    .container {
      max-width: 900px;
      margin: auto;
      background: var(--card);
      padding: 30px;
      border-radius: 16px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.4);
    }

    h2 {
      text-align: center;
      margin-bottom: 25px;
    }

    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 15px;
    }

    label {
      font-size: 14px;
      color: var(--muted);
      display: block;
      margin-top: 10px;
    }

    input,
    textarea {
      width: 100%;
      padding: 10px;
      margin-top: 6px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: #020617;
      color: var(--text);
    }

    input::placeholder,
    textarea::placeholder {
      color: #94a3b8;
    }

    textarea {
      resize: vertical;
    }

    .full {
      grid-column: span 2;
    }

    /* Skills Section */
    .skills-section {
      margin-top: 20px;
    }

    .skills-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
      gap: 10px;
      margin-top: 10px;
    }

    .skills-grid label {
      background: #020617;
      border: 1px solid var(--border);
      padding: 8px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 13px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .skills-grid input {
      accent-color: var(--primary);
      width: auto;
    }

    .btn {
      margin-top: 20px;
      padding: 12px;
      width: 100%;
      border: none;
      border-radius: 10px;
      background: var(--primary);
      color: white;
      cursor: pointer;
    }

    .btn:hover {
      background: var(--primary-dark);
    }

    .output {
      margin-top: 30px;
    }

    .card {
      background: #020617;
      border: 1px solid var(--border);
      padding: 20px;
      border-radius: 12px;
    }

    .Back-to-homepage {
      margin-top: 20px;
      padding: 12px 18px;
      background: linear-gradient(135deg, #6366f1, #4f46e5);
      color: #fff;
      border: none;
      border-radius: 10px;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.25s ease;
      box-shadow: 0 6px 15px rgba(99, 102, 241, 0.3);
    }

    /* Hover effect */
    .Back-to-homepage:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 20px rgba(99, 102, 241, 0.4);
      background: linear-gradient(135deg, #4f46e5, #4338ca);
    }

    /* Click effect */
    .Back-to-homepage:active {
      transform: scale(0.96);
      box-shadow: 0 4px 10px rgba(99, 102, 241, 0.3);
    }

    /* Optional: center it */
    .center-btn {
      display: flex;
      justify-content: center;
    }

    .badge {
      display: inline-block;
      background: rgba(99, 102, 241, 0.2);
      padding: 5px 10px;
      margin: 4px;
      border-radius: 999px;
      font-size: 12px;
    }

    @media(max-width: 600px) {
      .grid {
        grid-template-columns: 1fr;
      }

      .full {
        grid-column: span 1;
      }
    }
  </style>
</head>

<body>

  <div class="container">
    <h2>Create Your Profile</h2>

    <div class="grid">
      <div>
        <label>Name</label>
        <input type="text" id="name" placeholder="Enter your name">
      </div>

      <div>
        <label>Email</label>
        <input type="email" id="email" placeholder="Enter your email">
      </div>

      <div class="full">
        <label>Phone</label>
        <input type="text" id="phone" placeholder="Enter your phone">
      </div>

      <div class="full">
        <label>About You</label>
        <textarea id="about" placeholder="Write a short bio..."></textarea>
      </div>
    </div>

    <!-- Skills Section -->
    <div class="skills-section">
      <h3>Select Your Skills</h3>

      <div class="skills-grid">
        <div class="skill-option"><label><input type="checkbox" value="HTML"> HTML</label></div>
        <div class="skill-option"><label><input type="checkbox" value="CSS"> CSS</label></div>
        <div class="skill-option"><label><input type="checkbox" value="JavaScript"> JavaScript</label></div>
        <div class="skill-option"><label><input type="checkbox" value="React"> React</label></div>
        <div class="skill-option"><label><input type="checkbox" value="Node.js"> Node.js</label></div>
        <div class="skill-option"><label><input type="checkbox" value="Express"> Express</label></div>
        <div class="skill-option"><label><input type="checkbox" value="MongoDB"> MongoDB</label></div>
        <div class="skill-option"><label><input type="checkbox" value="SQL"> SQL</label></div>
        <div class="skill-option"><label><input type="checkbox" value="Python"> Python</label></div>
        <div class="skill-option"><label><input type="checkbox" value="C++"> C++</label></div>
        <div class="skill-option"><label><input type="checkbox" value="Java"> Java</label></div>
        <div class="skill-option"><label><input type="checkbox" value="Git"> Git</label></div>
        <div class="skill-option"><label><input type="checkbox" value="GitHub"> GitHub</label></div>
        <div class="skill-option"><label><input type="checkbox" value="Docker"> Docker</label></div>
        <div class="skill-option"><label><input type="checkbox" value="AWS"> AWS</label></div>
      </div>
    </div>

    <button class="btn" onclick="saveProfile()">Save Profile</button>

    <div class="output" id="output"></div>
  </div>

  <script>
    function saveProfile() {
      const name = document.getElementById("name").value.trim();
      const email = document.getElementById("email").value.trim().toLowerCase();
      const phone = document.getElementById("phone").value.trim();
      const about = document.getElementById("about").value;

      const selectedSkills = document.querySelectorAll(".skills-grid input:checked");
      const skills = Array.from(selectedSkills).map(skill => skill.value);

      // ✅ Validation
      if (!name || !email || !phone) {
        alert("Please fill all required fields");
        return;
      }

      let users = JSON.parse(localStorage.getItem("users")) || [];

      // 🔍 Find existing user (email OR phone)
      const index = users.findIndex(user =>
        user.email.toLowerCase() === email || user.phone === phone
      );

      const updatedUser = {
        name,
        email,
        phone,
        about,
        skills
      };

      if (index !== -1) {
        // ✏️ UPDATE
        users[index] = updatedUser;
        alert("Profile updated successfully!");
      } else {
        // ➕ CREATE
        users.push(updatedUser);
        alert("Profile created successfully!");
      }

      localStorage.setItem("users", JSON.stringify(users));

      displayProfile(updatedUser);
    }

    function displayProfile(user) {
      const output = document.getElementById("output");

      let skillsHTML = user.skills.map(skill =>
        `<span class="badge">${skill}</span>`
      ).join("");

      output.innerHTML = `
    <div class="card">
      <h3>${user.name}</h3>
      <p>${user.email} • ${user.phone}</p>
      <p>${user.about}</p>
      <div>${skillsHTML}</div>
      <div class="center-btn">
        <button class="Back-to-homepage" onclick="window.location.href='index.html'">
          Back to Homepage
        </button>
      </div>
    </div>
  `;
    }

    window.onload = () => {
  const editEmail = localStorage.getItem("editEmail");
  if (!editEmail) return;

  const users = JSON.parse(localStorage.getItem("users")) || [];

  const user = users.find(u => u.email.toLowerCase() === editEmail);

  if (user) {
    // Fill form
    document.getElementById("name").value = user.name;
    document.getElementById("email").value = user.email;
    document.getElementById("phone").value = user.phone;
    document.getElementById("about").value = user.about;

    // Reset checkboxes
    document.querySelectorAll(".skills-grid input").forEach(cb => {
      cb.checked = false;
    });

    // Re-check user's skills
    user.skills.forEach(skill => {
      const checkbox = document.querySelector(`.skills-grid input[value="${skill}"]`);
      if (checkbox) checkbox.checked = true;
    });
  }
};

  </script>

</body>

</html>
