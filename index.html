<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The IIIT Connection</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div id="main">

        <h1 class="title">The IIIT Connection</h1>

        <div class="buttons">
            <a href="front.html" onclick="setEditMode()">
                <button class="Createbt">Create / Edit Profile</button>
            </a>
            <a href="recruiter.html">
                <button class="Createbt">Find</button></a>

        </div>

    </div>
    <script>
        function setEditMode() {
            const email = prompt("Enter your email to edit profile (or leave blank to create new):");

            if (email) {
                localStorage.setItem("editEmail", email.toLowerCase());
            } else {
                localStorage.removeItem("editEmail");
            }
        }
    </script>

</body>

</html>
