<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Recruiter Dashboard</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">

<style>
:root {
  --primary:#6366f1;
  --bg:#0f172a;
  --card:#1e293b;
  --text:#e2e8f0;
  --muted:#94a3b8;
  --border:#334155;
}

* {
  box-sizing:border-box;
  font-family:'Inter';
  margin:0;
  padding:0;
}

body {
  background:var(--bg);
  color:var(--text);
  padding:20px;
}

.back-btn {
  position: fixed;
  top: 20px;
  right: 20px;
  padding: 10px 16px;
  background: linear-gradient(135deg, #6366f1, #4f46e5);
  color: white;
  border: none;
  border-radius: 10px;
  font-size: 13px;
  font-weight: 500;
  cursor: pointer;
  z-index: 1000;
  transition: all 0.25s ease;
  box-shadow: 0 6px 15px rgba(99,102,241,0.3);
}

.back-btn:hover {
  transform: translateY(-2px);
  box-shadow: 0 10px 20px rgba(99,102,241,0.4);
  background: linear-gradient(135deg, #4f46e5, #4338ca);
}

.back-btn:active {
  transform: scale(0.95);
}

/* Layout */
.container {
  display:grid;
  grid-template-columns: 250px 1fr;
  gap:20px;
  max-width:1100px;
  margin:auto;
}

/* Sidebar */
.sidebar {
  background:var(--card);
  padding:20px;
  border-radius:12px;
  border:1px solid var(--border);
  height:fit-content;
}

.sidebar h3 {
  margin-bottom:10px;
}

.skills-filter label {
  display:flex;
  gap:8px;
  margin:6px 0;
  font-size:13px;
  cursor:pointer;
}

.skills-filter input {
  accent-color: var(--primary);
}

/* Cards */
.results {
  width:100%;
}

.card {
  background:var(--card);
  padding:15px;
  margin-bottom:15px;
  border-radius:10px;
  border:1px solid var(--border);
  transition:0.2s;
}

.card:hover {
  transform:translateY(-3px);
  box-shadow:0 10px 20px rgba(0,0,0,0.4);
}

.meta {
  color:var(--muted);
  font-size:13px;
  margin:5px 0;
}

.badge {
  display:inline-block;
  background:rgba(99,102,241,0.2);
  color:#c7d2fe;
  padding:5px 10px;
  border-radius:999px;
  margin:4px;
  font-size:12px;
}

.empty {
  text-align:center;
  color:var(--muted);
}

/* Button */
.btn {
  margin-top:15px;
  width:100%;
  padding:10px;
  background:var(--primary);
  border:none;
  border-radius:8px;
  color:white;
  cursor:pointer;
}

.btn:hover {
  background:#4f46e5;
}

/* Responsive */
@media(max-width:700px){
  .container {
    grid-template-columns:1fr;
  }
}
</style>
</head>

<body>

<button class="back-btn" onclick="window.location.href='index.html'">
  Home
</button>

<div class="container">

  <!-- LEFT: FILTERS -->
  <div class="sidebar">
    <h3>Filter by Skills</h3>

    <div class="skills-filter">
      <label><input type="checkbox" value="HTML"> HTML</label>
      <label><input type="checkbox" value="CSS"> CSS</label>
      <label><input type="checkbox" value="JavaScript"> JavaScript</label>
      <label><input type="checkbox" value="React"> React</label>
      <label><input type="checkbox" value="Node.js"> Node.js</label>
      <label><input type="checkbox" value="Express"> Express</label>
      <label><input type="checkbox" value="MongoDB"> MongoDB</label>
      <label><input type="checkbox" value="SQL"> SQL</label>
      <label><input type="checkbox" value="Python"> Python</label>
      <label><input type="checkbox" value="C++"> C++</label>
      <label><input type="checkbox" value="Java"> Java</label>
      <label><input type="checkbox" value="Git"> Git</label>
      <label><input type="checkbox" value="GitHub"> GitHub</label>
      <label><input type="checkbox" value="Docker"> Docker</label>
      <label><input type="checkbox" value="AWS"> AWS</label>
    </div>

    <button class="btn" onclick="search()">Apply Filter</button>
  </div>

  <!-- RIGHT: RESULTS -->
  <div class="results" id="results"></div>

</div>

<script>

function search() {
  const selected = document.querySelectorAll(".skills-filter input:checked");
  const selectedSkills = Array.from(selected).map(cb => cb.value);

  const users = JSON.parse(localStorage.getItem("users")) || [];

  const filtered = users.filter(user => {
    if(selectedSkills.length === 0) return true;

    return selectedSkills.every(skill =>
      user.skills.includes(skill)
    );
  });

  display(filtered);
}

function display(users) {
  const res = document.getElementById("results");
  res.innerHTML = "";

  if(users.length === 0){
    res.innerHTML = `<div class="empty">No matching candidates found</div>`;
    return;
  }

  users.forEach(u => {

    const skills = u.skills.map(skill =>
      `<span class="badge">${skill}</span>`
    ).join("");

    res.innerHTML += `
      <div class="card">
        <h3>${u.name}</h3>
        <div class="meta">${u.email} • ${u.phone}</div>
        <p>${u.about}</p>
        <div>${skills}</div>
      </div>
    `;
  });
}

/* Load all users initially */
window.onload = () => {
  const users = JSON.parse(localStorage.getItem("users")) || [];
  display(users);
};

</script>

</body>
</html>
